<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tourbillon volant 3D</title>
<style>
  :root{ color-scheme: dark; }
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{background:#05070c radial-gradient(120% 90% at 50% 62%,#17263d 0%,#0b1220 46%,#05070c 100%)}
  canvas{display:block;width:100%;height:100%}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#9db7e6;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:32px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err">WebGL n'est pas disponible sur cet appareil.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const T = THREE, TAU = Math.PI*2, DEG = Math.PI/180;
const canvas = document.getElementById('c');
let renderer;
try { renderer = new T.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'}); }
catch(e){ document.getElementById('err').style.display='flex'; return; }
const WALL = !/[?&]hd/.test(location.search);   // wallpaper (light) mode by default; add ?hd for full quality
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, WALL ? 1.5 : 2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(26, 1, 10, 6000);

/* ---------- procedural studio environment for metal reflections ---------- */
(function(){
  const env = new T.Scene();
  const geo = new T.SphereGeometry(500, 48, 24);
  const col = [], pos = geo.attributes.position;
  const top = new T.Color(0x8fa6d0), mid = new T.Color(0x34456b), bot = new T.Color(0x0d1220);
  for(let i=0;i<pos.count;i++){
    const y = pos.getY(i)/500, c = new T.Color();
    if(y>0) c.copy(mid).lerp(top, Math.pow(y,1.4)); else c.copy(mid).lerp(bot, Math.pow(-y,.7));
    col.push(c.r,c.g,c.b);
  }
  geo.setAttribute('color', new T.Float32BufferAttribute(col,3));
  env.add(new T.Mesh(geo, new T.MeshBasicMaterial({vertexColors:true, side:T.BackSide})));
  function box(w,h,x,y,z,int,tint){
    const m = new T.Mesh(new T.PlaneGeometry(w,h), new T.MeshBasicMaterial({color:new T.Color(tint).multiplyScalar(int), side:T.DoubleSide}));
    m.position.set(x,y,z); m.lookAt(0,0,0); env.add(m);
  }
  box(260,160,-250,260,300,3.5,0xfff1dc);
  box(200,120, 300,150,200,2,0xcfe0ff);
  box(320, 60,   0,380,-120,1.1,0xffffff);
  box(140,260,-380,-40,-120,.8,0xffd9b0);
  box(180,100, 250,-200,260,3,0xb7ccff);
  box(120,120,   0,-300,300,2,0xffe7c4);
  box(700,700,   0,  0,430,.55,0xfff3e0);
  box(200,200, 150,-100,420,2.2,0xffffff);
  box(180,180,-170, 130,420,1.8,0xfff0d8);
  const pm = new T.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.03, 1, 2000).texture;
  pm.dispose();
})();

scene.add(new T.AmbientLight(0xffffff, .14));
const key = new T.DirectionalLight(0xfff0dd, 1.0); key.position.set(-300,420,600); scene.add(key);
const fill = new T.DirectionalLight(0x9db8ff, .45); fill.position.set(400,-200,300); scene.add(fill);
const rimL = new T.DirectionalLight(0xffffff, .2); rimL.position.set(0,300,-500); scene.add(rimL);

/* ---------- materials ---------- */
function grainTex(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0,0,512,512);
  for(let r=2;r<256;r+=.6){ const v = 128 + (Math.random()-.5)*80; g.strokeStyle = 'rgb('+v+','+v+','+v+')'; g.lineWidth = .9; g.beginPath(); g.arc(256,256,r,0,TAU); g.stroke(); }
  const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping;
  t.repeat.set(1/260,1/260); t.offset.set(.5,.5); t.anisotropy = 8; return t;
}
const grain = grainTex();
const metal = (color, rough, g) => new T.MeshStandardMaterial({color, metalness:1, roughness:rough, bumpMap:g?grain:null, bumpScale:.45});
const MAT = {
  gold : metal(0xd9993f,.3,true),  rose : metal(0xc9794f,.3,true),
  steel: metal(0xdbe1ea,.2,true),   dsteel: metal(0x7b8594,.34,true),
  goldP: metal(0xf6cf90,.16,false), steelP: metal(0xe6ebf2,.14,false), dsteelP: metal(0x8a93a2,.3,false),
  gG : new T.MeshStandardMaterial({color:0x5a4528, metalness:.85, roughness:.6, envMapIntensity:.42, bumpMap:grain, bumpScale:.3}),   // train: dark satin bronze
  gR : new T.MeshStandardMaterial({color:0x5c3a2c, metalness:.85, roughness:.6, envMapIntensity:.42, bumpMap:grain, bumpScale:.3}),
  gS : new T.MeshStandardMaterial({color:0x474e5a, metalness:.85, roughness:.58, envMapIntensity:.42, bumpMap:grain, bumpScale:.3}),
  dk : new T.MeshStandardMaterial({color:0x2e343d, metalness:.85, roughness:.6, envMapIntensity:.4}),
  goldH: new T.MeshStandardMaterial({color:0xffc84a, metalness:1, roughness:.14, emissive:0x7a4a08, emissiveIntensity:1.5}),  // escapement: bright
  steelH: new T.MeshStandardMaterial({color:0xf2f5fa, metalness:1, roughness:.12, emissive:0x1a1d24, emissiveIntensity:.6}),
  handG: new T.MeshStandardMaterial({color:0xeaa42c, metalness:1, roughness:.18, emissive:0x6a3d04, emissiveIntensity:1.0}),
  handR: new T.MeshStandardMaterial({color:0xffe08a, metalness:1, roughness:.1, emissive:0x8a5e12, emissiveIntensity:1.3}),
  shadow: new T.MeshBasicMaterial({color:0x000000, transparent:true, opacity:.5, depthWrite:false}),
  lumeH: new T.MeshStandardMaterial({color:0xcfe8c4, roughness:.6, emissive:0x7fc794, emissiveIntensity:.5}),
  rubyD: new T.MeshPhysicalMaterial({color:0x7a0a1a, metalness:0, roughness:.2, clearcoat:.6}),
  ruby : new T.MeshPhysicalMaterial({color:0xe01230, metalness:0, roughness:.06, clearcoat:1, emissive:0x7a0010, emissiveIntensity:.9}),
  blue : new T.MeshStandardMaterial({color:0x3f72ff, metalness:.85, roughness:.3, emissive:0x1a3aa0, emissiveIntensity:1.2}),
  black: new T.MeshStandardMaterial({color:0x06080c, roughness:.55, metalness:.3}),
  lume : new T.MeshStandardMaterial({color:0xeaf3e2, roughness:.4, emissive:0x9fd8b0, emissiveIntensity:.55})
};

/* ---------- geometry helpers ---------- */
function chaikin(pts, it){
  let p = pts;
  for(let k=0;k<it;k++){ const q = [];
    for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length];
      q.push(new T.Vector2(a.x*.75+b.x*.25, a.y*.75+b.y*.25), new T.Vector2(a.x*.25+b.x*.75, a.y*.25+b.y*.75)); }
    p = q; }
  return p;
}
function holePts(ri, ro, aS, aE, w){
  const hs = r => Math.asin(Math.min(.99, w/2/r));
  const pol = (r,a) => new T.Vector2(r*Math.cos(a), r*Math.sin(a));
  const P = [], a0o=aS+hs(ro), a1o=aE-hs(ro), a0i=aS+hs(ri), a1i=aE-hs(ri);
  let n = Math.max(6, Math.ceil((a1o-a0o)*ro/5));
  for(let i=0;i<=n;i++) P.push(pol(ro, a0o+(a1o-a0o)*i/n));
  n = Math.max(6, Math.ceil((a1i-a0i)*ri/5));
  for(let i=0;i<=n;i++) P.push(pol(ri, a1i-(a1i-a0i)*i/n));
  return chaikin(P, 2);
}
const EXT = (sh, depth, bev) => new T.ExtrudeGeometry(sh, {depth, bevelEnabled:true, bevelThickness:bev, bevelSize:bev*.8, bevelOffset:-bev*.8, bevelSegments:1, curveSegments:8});

function gearMesh(o){
  const N=o.N, m=o.m, r=m*N/2, rt=r+m, rr=r-1.25*m, p=TAU/N;
  const sh = new T.Shape(); let first = true;
  for(let k=0;k<N;k++){
    const a=k*p, rh=.25*p, tt=.10*p;
    const q = [[rr,a-rh*1.15],[rr,a-rh],[rt,a-tt],[rt,a+tt],[rr,a+rh],[rr,a+rh*1.15]];
    for(const [rad,ang] of q){ const x=rad*Math.cos(ang), y=rad*Math.sin(ang); if(first){sh.moveTo(x,y); first=false;} else sh.lineTo(x,y); }
  }
  sh.closePath();
  if(o.spokes){
    const hr = r*(o.hub||.2), ri = rr - r*(o.rim||.14), w = r*(o.sw||.09), s = o.spokes;
    for(let i=0;i<s;i++) sh.holes.push(new T.Path(holePts(hr, ri, i*TAU/s, (i+1)*TAU/s, w)));
  }
  return new T.Mesh(EXT(sh, o.th, Math.min(.3, o.th*.12)), o.mat);
}
function capsuleShape(L, w, slot){
  const r = w/2, s = new T.Shape();
  s.moveTo(0,-r); s.lineTo(L,-r); s.absarc(L,0,r,-Math.PI/2,Math.PI/2,false); s.lineTo(0,r); s.absarc(0,0,r,Math.PI/2,Math.PI*1.5,false);
  if(slot && L > w*2.6){
    const q = r*.42, a = r*1.15, b = L - r*1.15, h = new T.Path();
    h.moveTo(a,-q); h.lineTo(b,-q); h.absarc(b,0,q,-Math.PI/2,Math.PI/2,false); h.lineTo(a,q); h.absarc(a,0,q,Math.PI/2,Math.PI*1.5,false);
    s.holes.push(h);
  }
  return s;
}
function arm(x1,y1,x2,y2,z,w,th,mat,slot){
  const L = Math.hypot(x2-x1,y2-y1), m = new T.Mesh(EXT(capsuleShape(L,w,slot), th, .25), mat);
  m.position.set(x1,y1,z); m.rotation.z = Math.atan2(y2-y1,x2-x1); return m;
}
function cyl(r,h,z,mat,seg){ const m = new T.Mesh(new T.CylinderGeometry(r,r,h,seg||24), mat); m.rotation.x = Math.PI/2; m.position.z = z; return m; }
function jewel(x,y,z,r,dark){
  const g = new T.Group();
  g.add(cyl(r*1.9, r*.7, r*.35, dark?MAT.dk:MAT.goldP, 28));
  const ru = new T.Mesh(new T.SphereGeometry(r,20,14), dark?MAT.rubyD:MAT.ruby); ru.scale.z = .55; ru.position.z = r*.55; g.add(ru);
  g.position.set(x,y,z); return g;
}
function screw(x,y,z,r,ang,mat){
  const g = new T.Group();
  g.add(cyl(r, r*.55, r*.27, mat||MAT.steelP, 22));
  const sl = new T.Mesh(new T.BoxGeometry(r*1.7, r*.3, r*.25), MAT.black); sl.position.z = r*.56; sl.rotation.z = ang; g.add(sl);
  g.position.set(x,y,z); return g;
}
const polarXY = (c,d,a) => [c[0]+d*Math.cos(a), c[1]+d*Math.sin(a)];

function fixedRing(){
  const op = [], hp = [];
  for(let i=0;i<260;i++){ const an = i*TAU/260; op.push(new T.Vector2(ROUT*Math.cos(an), ROUT*Math.sin(an))); hp.push(new T.Vector2(RIN*Math.cos(-an), RIN*Math.sin(-an))); }
  const sh = new T.Shape(op); sh.holes.push(new T.Path(hp));
  const grp = new T.Group(), th = 6;
  grp.add(new T.Mesh(EXT(sh, th, .3), MAT.dk));
  const pitch = Math.PI*MC, H = 2.25*MC, rh = .25*pitch, tt = .10*pitch, Lr = 14;
  const prof = new T.Shape(); prof.moveTo(-rh,0); prof.lineTo(-tt,H); prof.lineTo(tt,H); prof.lineTo(rh,0); prof.closePath();
  const tg = new T.ExtrudeGeometry(prof, {depth:Lr, bevelEnabled:false});
  const inst = new T.InstancedMesh(tg, MAT.dk, NCR), mtx = new T.Matrix4();
  for(let j=0;j<NCR;j++){
    const a = j*TAU/NCR, X = new T.Vector3(-Math.sin(a), Math.cos(a), 0), Y = new T.Vector3(0,0,1), Zr = new T.Vector3(Math.cos(a), Math.sin(a), 0);
    mtx.makeBasis(X, Y, Zr); mtx.setPosition((RC_C-Lr/2)*Math.cos(a), (RC_C-Lr/2)*Math.sin(a), th + .3);
    inst.setMatrixAt(j, mtx);
  }
  grp.add(inst);
  return grp;
}
/* ---------- movement layout (dial plane = XY, +Z toward the viewer) ---------- */
const A = {}, pos = {};
const DR = 345;                      // dial radius
const SHIFT = 66;                    // original cage centre height (design units)
const RP = 106;                      // half-height of the outer frame (pole distance)
const RIN = 112, ROUT = 130;                 // fixed crown ring (the track of the frame pinion): hole / outer radius
const DEK = 187.4;                           // distance E axis -> carrier axis
const NCAR = 120, NE3 = 20, MCAR = 2*DEK/(NE3+NCAR);   // carrier ring (3rd axis) teeth / its drive gear / module
const NPN = 26, NCR = 78, MC = 3.1;          // frame pinion / crown teeth / module
const RC_C = MC*NCR/2, RP_N = MC*NPN/2;      // crown pitch radius, pinion pitch radius
const ZF = 54.3, ZPL = ZF + 1.25*MC;         // ring face height, crown pitch line height
const Z0 = ZPL + RP_N;                       // height of the frame's rotation axis
const LR = 24;                               // distance of the rear rail behind the axis
pos.C = [0,0];
pos.B = polarXY(pos.C, 108, 140*DEG);
pos.T = polarXY(pos.C, 81, -25*DEG);
pos.R = polarXY(pos.T, 76.5, 0*DEG);
pos.K = [0,-163];                    // tourbillon: between centre and 6 o'clock
(function(){
  const R = pos.R, K = pos.K, dx = K[0]-R[0], dy = K[1]-R[1], d = Math.hypot(dx,dy), ux = dx/d, uy = dy/d, dEK = DEK, dRE = 52;
  const a = (dRE*dRE-dEK*dEK+d*d)/(2*d), h = Math.sqrt(dRE*dRE-a*a);
  pos.E = [R[0]+a*ux - h*uy, R[1]+a*uy + h*ux];
})();
pos.M = polarXY(pos.C, 30, 105*DEG);
pos.H = pos.C.slice();
pos.K2 = pos.K.slice();

const GEARS = [
  {id:'Bw', ax:'B', N:96, m:2,   z:0,  th:3, spokes:9, hub:.12, rim:.055, sw:.026, mat:MAT.gG},
  {id:'Cpn',ax:'C', N:12, m:2,   z:0,  th:3, mat:MAT.gS},
  {id:'Cw', ax:'C', N:80, m:1.8, z:12, th:3, spokes:8, hub:.14, rim:.055, sw:.028, mat:MAT.gR},
  {id:'Tp', ax:'T', N:10, m:1.8, z:12, th:3, mat:MAT.gS},
  {id:'Tw', ax:'T', N:75, m:1.8, z:24, th:3, spokes:7, hub:.15, rim:.055, sw:.03,  mat:MAT.gG},
  {id:'Rp', ax:'R', N:10, m:1.8, z:24, th:3, mat:MAT.gS},
  {id:'Rw', ax:'R', N:39, m:2,   z:36, th:3, spokes:5, hub:.2,  rim:.09,  sw:.055, mat:MAT.gR},
  {id:'E1', ax:'E', N:13, m:2,   z:36, th:3, mat:MAT.gS},
  {id:'E3', ax:'E', N:NE3, m:MCAR, z:Z0-3, th:4, spokes:3, hub:.3, rim:.2, sw:.16, mat:MAT.steel},
  {id:'Cr', ax:'K2', N:NCAR, m:MCAR, z:Z0-3, th:6, virtual:true, mat:MAT.steel},
  {id:'Pc', ax:'C', N:12, m:1.25,z:60, th:3, mat:MAT.gS},
  {id:'Mw', ax:'M', N:36, m:1.25,z:60, th:3, spokes:4, hub:.2, rim:.1,  sw:.09, mat:MAT.gR},
  {id:'Mp', ax:'M', N:12, m:1,   z:72, th:3, mat:MAT.gS},
  {id:'Hw', ax:'H', N:48, m:1,   z:72, th:3, spokes:8, hub:.5, rim:.09, sw:.06, mat:MAT.gG}
];
const GI = {}; GEARS.forEach(g => GI[g.id] = g);
const MESH = [['Rw','E1'],['E3','Cr'],['Rp','Tw'],['Tp','Cw'],['Cpn','Bw'],['Pc','Mw'],['Mp','Hw']];
['K','K2','E','R','T','C','B','M','H'].forEach(id => A[id] = {id, x:pos[id][0], y:pos[id][1], k:0, phi0:0});
A.R.k = 1;                                  // the R wheel turns once a minute (7.5-min third wheel x 7.5)
MESH.forEach(([pa,ch]) => {
  const g1 = GI[pa], g2 = GI[ch], a1 = A[g1.ax], a2 = A[g2.ax];
  const dist = Math.hypot(a2.x-a1.x, a2.y-a1.y), want = (g1.m*g1.N + g2.m*g2.N)/2;
  if(Math.abs(dist-want) > .01) console.warn('mesh distance mismatch', pa, ch, dist, want);
  const al = Math.atan2(a2.y-a1.y, a2.x-a1.x);
  a2.k = -(g1.N/g2.N) * a1.k;
  a2.phi0 = (g1.N*(al-a1.phi0) + g2.N*(al+Math.PI) - Math.PI)/g2.N;
});
window.__A = A;

const world = new T.Group();
const objs = {};
GEARS.forEach(g => {
  if(g.virtual) return;
  const grp = new T.Group(), mesh = g.ring ? ringMesh(g) : gearMesh(g); mesh.position.z = g.z; grp.add(mesh);
  if(g.id === 'Bw'){
    const pts = [], r0 = 16, r1 = 80, turns = 9;
    for(let i=0;i<=360;i++){ const t = i/360, rad = r0 + t*(r1-r0), a = t*turns*TAU; pts.push(new T.Vector3(rad*Math.cos(a), rad*Math.sin(a), 0)); }
    const sp = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 500, .38, 5, false), MAT.blue); sp.position.z = 1.5; grp.add(sp);
  }
  grp.position.set(A[g.ax].x, A[g.ax].y, 0); world.add(grp);
  objs[g.id] = grp;
});

// arbors, bridges, jewels
['B','C','T','R','E','M'].forEach(id => {
  const gs = GEARS.filter(g => g.ax===id), z0 = Math.min(...gs.map(g=>g.z)), z1 = Math.max(...gs.map(g=>g.z+g.th));
  const ar = cyl(1.6, z1 - z0 + 12, (z0+z1)/2 - 2, MAT.dsteelP, 14); ar.position.x = A[id].x; ar.position.y = A[id].y; world.add(ar);
});
const backZ = -10;
[['B','C'],['C','T'],['T','R'],['R','E'],['C','M']].forEach(([p,q],i) => {
  world.add(arm(A[p].x,A[p].y,A[q].x,A[q].y,backZ,13,2.6,MAT.dk,true));
});
// the plate stops on the fixed ring: the E arm ends on the plate ring that carries it (nothing reaches the tourbillon centre)
const PLATE_R = 124;
{
  const dx = A.E.x-pos.K[0], dy = A.E.y-pos.K[1], d = Math.hypot(dx,dy);
  world.add(arm(A.E.x, A.E.y, pos.K[0]+dx/d*PLATE_R, pos.K[1]+dy/d*PLATE_R, backZ, 13, 2.6, MAT.dk, true));
}
['B','C','T','R','E','M'].forEach(id => { const j = jewel(A[id].x, A[id].y, backZ, 2.6, true); j.rotation.x = Math.PI; world.add(j); });
world.add(arm(A.B.x,A.B.y,A.C.x,A.C.y,7.2,12,2.6,MAT.dk,true));
world.add(arm(A.T.x,A.T.y,A.R.x,A.R.y,31,11,2.6,MAT.dk,true));
world.add(arm(A.R.x,A.R.y,A.E.x,A.E.y,43,12,2.6,MAT.dk,true));
[[A.B,7.2],[A.C,7.2],[A.T,31],[A.R,31],[A.R,43],[A.E,43]].forEach(([a,z]) => world.add(jewel(a.x,a.y,z+2.6,2.6,true)));
world.add(screw((A.B.x+A.C.x)/2,(A.B.y+A.C.y)/2,10,4,.7,MAT.dk));
world.add(screw((A.T.x+A.R.x)/2,(A.T.y+A.R.y)/2,33.6,3.8,1.4,MAT.dk));
world.add(screw((A.R.x+A.E.x)/2,(A.R.y+A.E.y)/2,45.6,3.8,2.1,MAT.dk));
(function(){
  const ex = pos.M[0] + 38*Math.cos(105*DEG+0.9), ey = pos.M[1] + 38*Math.sin(105*DEG+0.9);
  world.add(arm(pos.M[0],pos.M[1],ex,ey,76.5,9,2.2,MAT.dk,false));
  world.add(jewel(pos.M[0],pos.M[1],78.5,2.2,true)); world.add(screw(ex,ey,78.5,3,.6,MAT.dk));
})();

/* ---------- bevel gear helper (teeth shrink toward the apex) ---------- */
function bevelMesh(N, m, face, delta, mat, spokes){
  const r = m*N/2, h = r/Math.tan(delta);
  const o = {N, m, th:face, mat}; if(spokes){ o.spokes = spokes; o.hub = .26; o.rim = .16; o.sw = .13; }
  const mesh = gearMesh(o), g = mesh.geometry, p = g.attributes.position;
  for(let i=0;i<p.count;i++){ const s = Math.max(.03, 1 - p.getZ(i)/h); p.setX(i, p.getX(i)*s); p.setY(i, p.getY(i)*s); }
  p.needsUpdate = true; g.computeVertexNormals();
  return mesh;
}
function base(parent, p, X, Y, Z){
  const o = new T.Group();
  o.quaternion.setFromRotationMatrix(new T.Matrix4().makeBasis(new T.Vector3(...X), new T.Vector3(...Y), new T.Vector3(...Z)));
  o.position.set(...p); parent.add(o); return o;
}
const BY = [[0,0,1],[1,0,0],[0,1,0]];     // spur gear whose axis is +Y (gear angle = angle from +Z toward +X)

/* ---------- TRIAXIAL tourbillon ----------
   Kw (60 s) -> Pz (3:1) -> miter pair -> outer frame turning about the vertical axis (20 s)
   fixed wheel Fs + planet Ps (1:1) -> bevel Br/Bc (1:3) -> inner cage turns 60 s inside the frame            */
const NFs = 12, NPs = 12, NBr = 8, NBc = 12;
const HBR = NBr/Math.tan(Math.atan(NBr/NBc)), HBC = NBc/Math.tan(Math.atan(NBc/NBr));
const tourG = new T.Group(); tourG.position.set(pos.K[0], pos.K[1], Z0); world.add(tourG);
const F = new T.Group(); tourG.add(F);
{ const fr = fixedRing(); fr.position.set(pos.K[0], pos.K[1], 48); world.add(fr);
  // plate ring (skeleton band) under the fixed ring, linked to it by three pillars
  { const op = [], ip = [];
    for(let i=0;i<260;i++){ const an = i*TAU/260; op.push(new T.Vector2((PLATE_R+7)*Math.cos(an), (PLATE_R+7)*Math.sin(an))); ip.push(new T.Vector2((PLATE_R-7)*Math.cos(-an), (PLATE_R-7)*Math.sin(-an))); }
    const psh = new T.Shape(op); psh.holes.push(new T.Path(ip));
    for(let i=0;i<12;i++) psh.holes.push(new T.Path(holePts(PLATE_R-4.6, PLATE_R+4.6, i*TAU/12, (i+1)*TAU/12, 7)));
    const pr = new T.Mesh(EXT(psh, 2.6, .25), MAT.dk); pr.position.set(pos.K[0], pos.K[1], backZ); world.add(pr); }
  [200, 270, 340].forEach(d => { const a = d*DEG, px = pos.K[0] + PLATE_R*Math.cos(a), py = pos.K[1] + PLATE_R*Math.sin(a);
    const pst = cyl(3.4, 58, 19, MAT.dk, 14); pst.position.x = px; pst.position.y = py; world.add(pst);
    const sc = screw(px, py, backZ-.4, 4.4, a, MAT.dk); sc.rotation.x = Math.PI; world.add(sc); } ); }                       // outer frame (rotates about Y)
const innerSpin = new T.Group(); F.add(innerSpin);           // inner cage (rotates about the frame's Z')
const cageG = new T.Group(); cageG.position.z = -SHIFT; innerSpin.add(cageG);
const fShift = new T.Group(); fShift.position.z = -SHIFT; F.add(fShift);

// --- inner cage (same as before, centred on the frame) ---
const RC = 96;
const NF = 144, NP = 12, MF = .615;
const OFF = MF*(NF+NP)/2;
const PTR = Math.PI/2;
const BETA = PTR + 120*DEG;
const BcL = [OFF*Math.cos(BETA), OFF*Math.sin(BETA)];
const ANGE = BETA + 75*DEG;
const EcL = [OFF*Math.cos(ANGE), OFF*Math.sin(ANGE)];
const ring = new T.Mesh(new T.TorusGeometry(RC, 3.4, 14, 120), MAT.steelH); ring.position.z = 62; cageG.add(ring);
const ring2 = new T.Mesh(new T.TorusGeometry(RC, 1.1, 8, 120), MAT.dsteel); ring2.position.z = 65.8; cageG.add(ring2);
for(let i=0;i<3;i++){
  const a = PTR + i*TAU/3, x = RC*Math.cos(a), y = RC*Math.sin(a);
  const post = cyl(3.6, 24, 65, MAT.steelH, 18); post.position.x = x; post.position.y = y; cageG.add(post);
  cageG.add(arm(0,0,RC*Math.cos(a),RC*Math.sin(a),76,i===0?13:11,4,MAT.steelH,true));

}
cageG.add(cyl(11, 5, 80, MAT.goldP, 32)); cageG.add(cyl(3.4, 4, 83, MAT.ruby, 20));
cageG.add(cyl(1.6, 30, 66, MAT.dsteelP, 12));

const balG = new T.Group(); balG.position.set(BcL[0], BcL[1], 0); cageG.add(balG);
{
  const bz = 66, BR = 38;
  const wr = new T.Mesh(new T.TorusGeometry(BR, 2.7, 10, 90), MAT.goldH); wr.position.z = bz; balG.add(wr);
  for(let i=0;i<2;i++){ const bar = new T.Mesh(new T.BoxGeometry(BR*2, 3.2, 1.8), MAT.goldH); bar.position.z = bz; bar.rotation.z = i*Math.PI/2 + .3; balG.add(bar); }
  for(let i=0;i<12;i++){ const a = i*TAU/12, sc = new T.Mesh(new T.SphereGeometry(2.5,14,10), MAT.goldH); sc.position.set(BR*Math.cos(a), BR*Math.sin(a), bz); balG.add(sc); }
  const pts = [], turns = 9.5;
  for(let i=0;i<=420;i++){ const t = i/420, rad = 4 + t*17, a = t*turns*TAU; pts.push(new T.Vector3(rad*Math.cos(a), rad*Math.sin(a), 0)); }
  const hs = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 600, .26, 4, false), MAT.blue); hs.position.z = 70.5; balG.add(hs);

  balG.add(cyl(2.8, 4, bz, MAT.goldP, 16)); balG.add(cyl(1.5, 22, 66, MAT.dsteelP, 10));
}
// fixed seconds wheel is fixed to the FRAME; the escape pinion rolls around it
const fixedW = gearMesh({N:NF, m:MF, th:2, spokes:6, hub:.2, rim:.1, sw:.05, mat:MAT.steelH}); fixedW.position.z = 56; fShift.add(fixedW);
const escG = new T.Group(); escG.position.set(EcL[0], EcL[1], 0); cageG.add(escG);
const RE = 13.5;
{
  const pin = gearMesh({N:NP, m:MF, th:2, mat:MAT.steelP}); pin.position.z = 56; escG.add(pin);
  const N = 15, sh = new T.Shape(); let f = true;
  for(let k=0;k<N;k++){ const a = k*TAU/N; [[RE*.6,a],[RE*.6,a+.05],[RE,a+.34],[RE*.6,a+.4]].forEach(([r,an]) => { const x=r*Math.cos(an), y=r*Math.sin(an); if(f){sh.moveTo(x,y); f=false;} else sh.lineTo(x,y); }); }
  sh.closePath();
  for(let i=0;i<3;i++) sh.holes.push(new T.Path(holePts(3.4, 6.8, i*TAU/3, (i+1)*TAU/3, 2.4)));
  const ew = new T.Mesh(EXT(sh, 2, .22), MAT.steelH); ew.position.z = 60; escG.add(ew);

const forkG = new T.Group(); cageG.add(forkG);
{
  const dx = BcL[0]-EcL[0], dy = BcL[1]-EcL[1], lb = Math.hypot(dx,dy), ux = dx/lb, uy = dy/lb, dirF = Math.atan2(uy,ux);
  const Fp = [EcL[0]+21*ux, EcL[1]+21*uy];
  forkG.position.set(Fp[0], Fp[1], 0);
  [-1,1].forEach(sg => {
    const ang = dirF + sg*34*DEG, sx = EcL[0] + (RE+.6)*Math.cos(ang) - Fp[0], sy = EcL[1] + (RE+.6)*Math.sin(ang) - Fp[1];
    forkG.add(arm(0,0,sx,sy,60,3.2,2,MAT.goldH,false));
    const st = new T.Mesh(new T.BoxGeometry(4.2,2.4,2), MAT.ruby); st.position.set(sx,sy,61); st.rotation.z = ang + Math.PI/2; forkG.add(st);
  });
  const hl = lb - 21 - 7.5;
  forkG.add(arm(0,0,ux*hl,uy*hl,60,3.2,2,MAT.goldH,false));
  forkG.add(arm(0,0,-ux*9,-uy*9,60,3.6,2,MAT.goldH,false));
  forkG.add(cyl(2, 4, 61, MAT.goldP, 14));
}
cageG.add(jewel(BcL[0], BcL[1], 80, 3.2));

// --- inner axle + bevel Bc (rear of the cage) ---
{
  const ax = cyl(2.2, 12, -18, MAT.dsteelP, 14); innerSpin.add(ax);
  const bc = base(innerSpin, [0,0,-LR+HBC], [1,0,0],[0,-1,0],[0,0,-1]);
  bc.add(bevelMesh(NBc, 2, 5, Math.atan(NBc/NBr), MAT.steelH, 3));
}
// --- outer frame: C-shaped, axle along Y through the cage centre, rear rail at z'=-LR ---
const mkCylY = (r,h,x,y,z,mat) => { const m = new T.Mesh(new T.CylinderGeometry(r,r,h,18), mat); m.position.set(x,y,z); return m; };
{
  F.add(mkCylY(3.6, 2*140+40, 0, 4, 0, MAT.steelP));
  const topArm = new T.Mesh(new T.BoxGeometry(14, 9, LR+8), MAT.steelH); topArm.position.set(0, RP, -LR/2); F.add(topArm);
  const botArm = new T.Mesh(new T.BoxGeometry(14, 9, LR+8), MAT.steelH); botArm.position.set(0, -RP, -LR/2); F.add(botArm);
  [topArm, botArm].forEach(a => { const e = new T.Mesh(new T.BoxGeometry(14.2, 1.2, LR+8.2), MAT.goldP); e.position.copy(a.position); e.position.y += 4.2; F.add(e); });
}
const rail = new T.Group(); rail.position.set(0,0,-LR); F.add(rail);
{
  const r = new T.Mesh(new T.CylinderGeometry(3.2,3.2,250,16), MAT.dsteelP); r.position.y = 12; rail.add(r);
  const ps = base(rail, [0,128,0], ...BY); ps.add(gearMesh({N:NPs, m:2, th:4, spokes:4, hub:.3, rim:.22, sw:.16, mat:MAT.steelH}));
  const br = base(rail, [0,HBR,0], [1,0,0],[0,0,1],[0,-1,0]);
  br.add(bevelMesh(NBr, 2, 5, Math.atan(NBr/NBc), MAT.steelH));
}
// --- frame pinion on the lower end of the axle: rolls on the crown teeth of the seconds ring ---
{
  const pn = base(F, [0,-126,0], ...BY); pn.add(gearMesh({N:NPN, m:MC, th:8, spokes:5, hub:.3, rim:.16, sw:.09, mat:MAT.steelH}));
}
// --- carrier (3rd axis): a big toothed ring around everything, driven by E3, holding the frame's two bearings ---
function carrierMesh(){
  const N = NCAR, m = MCAR, r = m*N/2, rt = r + m, rr = r - 1.25*m, p = TAU/N, pts = [];
  for(let k=0;k<N;k++){
    const a = k*p, rh = .29*p, tt = .13*p;
    [[rr,a-rh*1.15],[rr,a-rh],[rt,a-tt],[rt,a+tt],[rr,a+rh],[rr,a+rh*1.15]].forEach(([rad,ang]) => pts.push(new T.Vector2(rad*Math.cos(ang), rad*Math.sin(ang))));
  }
  const sh = new T.Shape(pts), hp = [];
  for(let i=0;i<220;i++){ const an = -i*TAU/220; hp.push(new T.Vector2((rr-10)*Math.cos(an), (rr-10)*Math.sin(an))); }
  sh.holes.push(new T.Path(hp));
  return new T.Mesh(EXT(sh, 6, .3), MAT.steelH);
}
const RCAR_TIP = MCAR*NCAR/2 + MCAR;
{
  const cm = carrierMesh(); cm.position.z = -3; tourG.add(cm);
  const fs = base(tourG, [0,128,0], ...BY); fs.add(gearMesh({N:NFs, m:2, th:4, spokes:4, hub:.3, rim:.22, sw:.16, mat:MAT.steelH}));
  tourG.add(mkCylY(3, 4, 0, 136, 0, MAT.dsteelP));
  const sT = new T.Mesh(new T.BoxGeometry(14, 24, 10), MAT.steelH); sT.position.set(0, 147.5, 0); tourG.add(sT);
  const sB = new T.Mesh(new T.BoxGeometry(14, 28, 10), MAT.steelH); sB.position.set(0, -146.5, 0); tourG.add(sB);
  tourG.add(jewel(0, 144, 5.2, 3.8)); tourG.add(jewel(0, -142, 5.2, 3.8));
  tourG.add(screw(0, 154, 5.2, 4.2, .9, MAT.goldP)); tourG.add(screw(0, -153, 5.2, 4.2, 1.5, MAT.goldP));
}
// guide posts that hold the carrier ring at the plate
[140, 220].forEach(d => {
  const a = d*DEG, rr = RCAR_TIP + 7, px = pos.K[0] + rr*Math.cos(a), py = pos.K[1] + rr*Math.sin(a);
  const post = cyl(4.5, Z0-40, (40+Z0)/2, MAT.dsteelP, 16); post.position.x = px; post.position.y = py; world.add(post);
  const fl = cyl(8.5, 3, Z0, MAT.goldP, 28); fl.position.x = px; fl.position.y = py; world.add(fl);
  world.add(screw(px, py, Z0+1.5, 4, a, MAT.steelP));
});

/* ---------- dial: minute track + hands ---------- */
{
  const g = new T.Group(); g.position.z = 148; const R = DR;
  g.add(new T.Mesh(new T.TorusGeometry(R-14, .8, 8, 240), MAT.dsteel));
  for(let i=0;i<60;i++){
    const maj = i%5===0, a = i*6*DEG, len = maj?18:7, wd = maj?3.6:1.4;
    const t = new T.Mesh(new T.BoxGeometry(wd, len, 1.8), maj ? MAT.lume : MAT.steelP);
    const rad = R - len/2; t.position.set(rad*Math.sin(a), rad*Math.cos(a), 0); t.rotation.z = -a; g.add(t);
  }
  [0,90,180,270].forEach(d => { const a = d*DEG; g.add(screw((R+10)*Math.sin(a),(R+10)*Math.cos(a),-.5,5,a,MAT.goldP)); });
  world.add(g);
}
/* ---------- Louis XV hands: pierced ring, spearhead tip, volutes, polished ridge, black outline + drop shadow ---------- */
function partShape(p, pad){
  const s = new T.Shape();
  if(p.t === 'ring'){
    s.absarc(0,0,p.ro+pad,0,TAU,false);
    const h = new T.Path(); h.absarc(0,0,Math.max(1.5,p.ri-pad),0,TAU,true); s.holes.push(h);
  } else if(p.t === 'shaft'){
    const y0 = p.y0-pad, y1 = p.y1+pad, w0 = p.w0+2*pad, w1 = p.w1+2*pad;
    s.moveTo(-w0/2,y0); s.lineTo(w0/2,y0); s.lineTo(w1/2,y1); s.lineTo(-w1/2,y1); s.closePath();
  } else if(p.t === 'tip'){
    const y0 = p.y0-pad*.6, y1 = p.y1+pad*1.5, w = p.w+2*pad, d = y1-y0;
    s.moveTo(-w/2,y0); s.quadraticCurveTo(-w*.16, y0+d*.6, 0, y1); s.quadraticCurveTo(w*.16, y0+d*.6, w/2, y0); s.closePath();
  }
  return s;
}
function louisXV(spec, z){
  const g = new T.Group();
  spec.parts.forEach(p => {
    const place = m => { m.position.x += p.x||0; m.position.y += p.y||0; return m; };
    const sh = new T.Mesh(EXT(partShape(p, 6.5), .2, .05), MAT.shadow); sh.position.z = z-5; g.add(place(sh));
    const un = new T.Mesh(EXT(partShape(p, 2.3), 1, .15), MAT.black); un.position.z = z-.9; g.add(place(un));
  });
  spec.parts.forEach(p => {
    const pl = new T.Mesh(EXT(partShape(p, 0), 1.6, .4), MAT.handG); pl.position.z = z; pl.position.x += p.x||0; pl.position.y += p.y||0; g.add(pl);
    if(p.t === 'ring' && p.lume){ const d = new T.Mesh(new T.CylinderGeometry(p.ri-2.1, p.ri-2.1, .6, 28), MAT.lumeH); d.rotation.x = Math.PI/2; d.position.set(p.x||0, p.y||0, z-.55); g.add(d); }
  });
  (spec.ridges||[]).forEach(r => { const m = new T.Mesh(EXT(partShape({t:'shaft',y0:r.y0,y1:r.y1,w0:r.w0,w1:r.w1},0), .5, .12), MAT.handR); m.position.z = z+1.6; g.add(m); });
  return g;
}
function hourSpec(L){
  const yR = L*.58, R = 24, parts = [
    {t:'shaft', y0:-30, y1:L*.42, w0:10, w1:10},
    {t:'ring', x:0, y:-36, ro:9, ri:4.5},
    {t:'ring', x:0, y:yR, ro:R, ri:14, lume:true},
    {t:'tip', y0:yR+R-5, y1:L, w:27}];
  [-1,1].forEach(sg => { const a = (-90+sg*55)*Math.PI/180; parts.push({t:'ring', x:(R+4)*Math.cos(a), y:yR+(R+4)*Math.sin(a), ro:7, ri:3.2}); });
  return {parts, ridges:[{y0:-26,y1:yR-R+2,w0:2,w1:2},{y0:yR+R-2,y1:L-6,w0:2.2,w1:.5}]};
}
function minSpec(L){
  const yR = L*.77, R = 13.5;
  return {parts:[
    {t:'shaft', y0:-40, y1:L*.8, w0:6, w1:4},
    {t:'ring', x:0, y:-46, ro:9, ri:4.5},
    {t:'ring', x:0, y:L*.42, ro:7.5, ri:3.6},
    {t:'ring', x:0, y:yR, ro:R, ri:7.8, lume:true},
    {t:'tip', y0:yR+R-4, y1:L, w:11}],
    ridges:[{y0:-36,y1:yR-R+2,w0:1.6,w1:1.2},{y0:yR+R-2,y1:L-5,w0:1.6,w1:.4}]};
}
const hourHand = louisXV(hourSpec(205), 152.5), minHand = louisXV(minSpec(315), 157.5);
world.add(hourHand, minHand);
{ // centre boss: domed cap, polished ring, ruby
  const cap = cyl(11, 5, 161, MAT.handG, 40); world.add(cap);
  const rg = new T.Mesh(new T.TorusGeometry(6.5, 1.2, 10, 40), MAT.handR); rg.position.z = 164; world.add(rg);
  const ru = new T.Mesh(new T.SphereGeometry(3.6,18,14), MAT.ruby); ru.scale.z = .7; ru.position.z = 164; world.add(ru);
}

/* ---------- time-driven update ---------- */
const FREQ = 3, AMP = 235*DEG;
function update(S){
  const th = TAU*S/60;
  for(const id in A) A[id].phi = A[id].phi0 - A[id].k*th;
  GEARS.forEach(g => { if(!g.virtual) objs[g.id].rotation.z = A[g.ax].phi; });
  const Om = A.K2.phi;
  tourG.rotation.z = Om;                    // 3rd axis: the whole carrier (ring + frame + cage) turns about Z
  const phiK = A.K.phi;
  // 1) frame pinion rolling on the ring's crown teeth: the frame turns 3x faster than the ring (20 s per turn)
  const theta = (NCR/NPN)*Om - Math.PI/2 - Math.PI/NPN;
  F.rotation.y = theta;
  // 2) (inner cage drive below)
  // 3) planet Ps rolling on the fixed wheel Fs (axes parallel to Y)
  const sPs = theta + (NFs*(theta + Math.PI) - Math.PI)/NPs;
  const rRail = sPs - theta;
  rail.rotation.y = rRail;
  // 4) bevel Br (on the rail) -> Bc (on the inner axle), both inside the frame
  const rBr = -rRail;
  const rBc = -Math.PI/2 + (NBr*(Math.PI/2 - rBr) - Math.PI)/NBc;
  const sIn = -rBc;
  innerSpin.rotation.z = sIn;
  // 5) escape pinion rolling around the wheel fixed to the frame
  const al = ANGE + sIn, phiP = (NF*al + NP*(al+Math.PI) - Math.PI)/NP;
  escG.rotation.z = phiP - sIn;
  const osc = Math.sin(TAU*FREQ*S);
  balG.rotation.z = AMP*osc;
  forkG.rotation.z = 7*DEG*Math.tanh(7*osc);
  const thH = TAU*(window.__SH != null ? window.__SH : S)/60;      // hands can be frozen separately (video mode)
  minHand.rotation.z = -A.C.k*thH;
  hourHand.rotation.z = -A.H.k*thH;
  window.__ang = {theta, sIn, Om, phiK};
}
function secondsNow(){ const d = new Date(); return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds() + d.getMilliseconds()/1000; }
window.__S = null;

/* ---------- fixed front view ---------- */
world.position.set(0,0,-85);
scene.add(world);
function resize(){
  const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w,h,false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  const R = 372, vt = Math.tan(camera.fov*DEG/2);
  const dist = Math.max(R/(vt*camera.aspect), R/vt*.78) * 1.03;
  camera.position.set(0,0,dist); camera.lookAt(0,0,0);
}
window.addEventListener('resize', resize); resize();
let lastDraw = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden) return;                       // nothing to draw when the screen is off / page hidden
  if(WALL && now - lastDraw < 33) return;           // ~30 fps in wallpaper mode
  lastDraw = now;
  update(window.__S != null ? window.__S : secondsNow());
  renderer.render(scene, camera);
  window.__ready = true;
}
requestAnimationFrame(frame);
})();
